<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stats Candidatic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    h1 { font-size: 20px; color: #94a3b8; margin-bottom: 32px; letter-spacing: 0.05em; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 32px; }
    .stat { background: #0f172a; border-radius: 12px; padding: 20px 12px; }
    .stat .num { font-size: 42px; font-weight: 700; line-height: 1; }
    .stat .label { font-size: 12px; color: #64748b; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .complete .num { color: #22c55e; }
    .pending .num  { color: #f59e0b; }
    .total .num    { color: #60a5fa; }
    .refresh-btn {
      background: #334155;
      color: #f1f5f9;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .refresh-btn:hover { background: #475569; }
    .timestamp { font-size: 12px; color: #475569; margin-top: 16px; }
    .error { color: #f87171; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📊 Candidatos</h1>
    <div class="grid">
      <div class="stat complete"><div class="num" id="complete">—</div><div class="label">Completos</div></div>
      <div class="stat pending"><div class="num" id="pending">—</div><div class="label">Incompletos</div></div>
      <div class="stat total"><div class="num" id="total">—</div><div class="label">Total</div></div>
    </div>
    <button class="refresh-btn" onclick="load()">↻ Actualizar</button>
    <div class="timestamp" id="ts"></div>
    <div class="error" id="err"></div>
  </div>

  <script>
    async function load() {
      document.getElementById('err').textContent = '';
      try {
        const r = await fetch('/api/candidates?stats=true&limit=1');
        if (!r.ok) throw new Error('Sin acceso — inicia sesión primero');
        const d = await r.json();
        const s = d.stats;
        document.getElementById('complete').textContent = s.complete.toLocaleString();
        document.getElementById('pending').textContent  = s.pending.toLocaleString();
        document.getElementById('total').textContent    = s.candidates.toLocaleString();
        document.getElementById('ts').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-MX');
      } catch(e) {
        document.getElementById('err').textContent = e.message;
      }
    }
    load();
  </script>
</body>
</html>
